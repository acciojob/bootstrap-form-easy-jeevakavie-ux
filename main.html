<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internship Form</title>

    
    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >

    <style>
        .form-container {
            border: 1px solid #ddd;
            padding: 30px;
            margin-top: 25px;
        }

        .form-title {
            text-align: center;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

<div class="container form-container">

    <h2 class="form-title">Internship Form</h2>

    <form class="needs-validation" novalidate>

       
        <div class="form-row">

           
            <div class="form-group col-md-4">
                <label for="first-name-input">First Name</label>

                <input
                    type="text"
                    class="form-control"
                    id="first-name-input"
                    required
                >

                <div class="invalid-feedback">
                    First name required!
                </div>
            </div>


            
            <div class="form-group col-md-4">
                <label for="last-name-input">Last Name</label>

                <input
                    type="text"
                    class="form-control"
                    id="last-name-input"
                    required
                >

                <div class="invalid-feedback">
                    Last name required!
                </div>
            </div>


            
            <div class="form-group col-md-4">
                <label for="email-input">Email Address</label>

                <input
                    type="email"
                    class="form-control"
                    id="email-input"
                    placeholder="xyz@abc.com"
                    required
                >

                <div class="invalid-feedback">
                    Email required!
                </div>
            </div>

        </div>


        
        <div class="form-row">

            
            <div class="form-group col-md-6">
                <label for="college-input">College</label>

                <input
                    type="text"
                    class="form-control"
                    id="college-input"
                    required
                >

                <div class="invalid-feedback">
                    Please provide a valid college.
                </div>
            </div>


           
            <div class="form-group col-md-3">
                <label for="graduation-year">Graduation Year</label>

                <select
                    class="form-control"
                    id="graduation-year"
                    required
                >
                    <option value="">Choose...</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                </select>

                <div class="invalid-feedback">
                    Please select a valid Graduation Year.
                </div>
            </div>


           
            <div class="form-group col-md-3">
                <label for="roll-no-input">Roll No.</label>

                <input
                    type="text"
                    class="form-control"
                    id="roll-no-input"
                    required
                >

                <div class="invalid-feedback">
                    Please provide a valid Roll no.
                </div>
            </div>

        </div>


        
        <div class="form-group">

            <div class="form-check">

                <input
                    type="checkbox"
                    class="form-check-input"
                    id="conditions-checkbox"
                    required
                >

                <label
                    class="form-check-label"
                    for="conditions-checkbox"
                >
                    Agree to terms and conditions
                </label>

                <div class="invalid-feedback">
                    You must agree before submitting.
                </div>

            </div>

        </div>


        
        <button
            type="submit"
            class="btn btn-primary"
        >
            Submit form
        </button>

    </form>

</div>


<script>
(function () {
    'use strict';

    window.addEventListener('load', function () {

        var forms = document.getElementsByClassName('needs-validation');

        Array.prototype.filter.call(forms, function (form) {

            form.addEventListener('submit', function (event) {

                if (form.checkValidity() === false) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                form.classList.add('was-validated');

            }, false);

        });

    }, false);

})();
</script>

</body>
</html>
